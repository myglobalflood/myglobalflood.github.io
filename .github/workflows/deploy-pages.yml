name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_URL: https://myglobalflood.github.io/
        run: npm run build:pages

      - name: Download assets from the two previous successful releases
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const directory = path.join(process.env.RUNNER_TEMP, 'previous-pages');
            await fs.mkdir(directory, { recursive: true });
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'deploy-pages.yml',
              branch: 'main', status: 'success', per_page: 2
            });
            for (const [index, run] of data.workflow_runs.entries()) {
              const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: run.id
              });
              const artifact = artifacts.artifacts.find(item => item.name === 'github-pages' && !item.expired);
              if (!artifact) continue;
              const { data: archive } = await github.rest.actions.downloadArtifact({
                ...context.repo, artifact_id: artifact.id, archive_format: 'zip'
              });
              await fs.writeFile(path.join(directory, `${index}.zip`), Buffer.from(archive));
            }

      - name: Retain cached-page assets and check all exported page references
        shell: bash
        run: |
          previous=()
          for archive in "$RUNNER_TEMP"/previous-pages/*.zip; do
            [ -f "$archive" ] || continue
            directory="${archive%.zip}"
            mkdir -p "$directory"
            unzip -q "$archive" -d "$directory"
            tar -xf "$directory/artifact.tar" -C "$directory"
            previous+=("$directory")
          done
          node scripts/prepare-pages-assets.mjs out "${previous[@]}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
